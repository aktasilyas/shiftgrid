name: shiftgrid
description: "Snake Shift — release the snakes, clear the grid (Android-first)."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  audioplayers: ^6.7.1
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#14161C"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter_native_splash:
  color: "#14161C"
  image: "assets/app_icon.png"
  android_12:
    color: "#14161C"
    image: "assets/app_icon.png"
